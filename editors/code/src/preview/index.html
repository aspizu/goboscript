<!doctype html>
<html class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
    <link rel="stylesheet" href="{{tailwind}}" />
  </head>
  <body class="flex h-full flex-col bg-vscode-background font-sans text-vscode-foreground">
    <div id="toolbar" class="flex flex-none gap-1 border-b border-vscode-border px-1.5 py-1">
      <button
        id="reload"
        title="Reload the project from the .sb3 file on disk"
        class="flex h-6 w-6 items-center justify-center rounded-[5px] bg-transparent p-0 text-xs text-vscode-icon enabled:cursor-pointer enabled:hover:bg-vscode-hover enabled:active:bg-vscode-active disabled:cursor-default disabled:opacity-40"
      >
        <svg viewBox="0 0 15 15" fill="none" class="h-4 w-4">
          <path
            d="M7.50037 0.850006C10.6644 0.850189 12.2943 3.06869 12.9994 4.31094L13.0004 4.31192V2.5004C13.0004 2.22425 13.2242 2.0004 13.5004 2.0004C13.7763 2.00059 14.0004 2.22438 14.0004 2.5004V5.5004C14.0002 5.77625 13.7762 6.0002 13.5004 6.0004H10.5004C10.2243 6.0004 10.0006 5.77637 10.0004 5.5004C10.0004 5.22425 10.2242 5.0004 10.5004 5.0004H12.2328L12.1215 4.79239C11.4802 3.66597 10.1107 1.85019 7.50037 1.85001C4.06019 1.85001 1.84998 4.665 1.84998 7.5004C1.85018 10.3357 4.06034 13.1498 7.50037 13.1498C9.16525 13.1497 10.5296 12.496 11.5013 11.5072L11.6927 11.3031C12.126 10.8159 12.4715 10.2575 12.7172 9.66055L12.765 9.57071C12.8948 9.37795 13.1462 9.2963 13.3695 9.38809C13.6248 9.49314 13.7468 9.78515 13.642 10.0404L13.5111 10.3373C13.2362 10.9247 12.8771 11.4767 12.4398 11.9682L12.2142 12.2084C11.0628 13.3807 9.44396 14.1497 7.50037 14.1498C3.43771 14.1498 0.850179 10.8149 0.849976 7.5004C0.849976 4.1858 3.43755 0.850006 7.50037 0.850006Z"
            fill="currentColor"
          />
        </svg>
      </button>
      <button
        id="green-flag"
        disabled
        title="Start the project"
        class="flex h-6 w-6 items-center justify-center rounded-[5px] bg-transparent p-0 text-xs text-vscode-icon enabled:cursor-pointer enabled:hover:bg-vscode-hover enabled:active:bg-vscode-active disabled:cursor-default disabled:opacity-40"
      >
        <svg viewBox="0 0 15 15" fill="none" class="h-4 w-4">
          <path
            d="M3.24219 2.32213C3.39223 2.23169 3.57845 2.22573 3.7334 2.30748L12.7334 7.05748C12.8974 7.14403 13 7.31443 13 7.49986C13 7.68529 12.8974 7.85569 12.7334 7.94224L3.7334 12.6922C3.57845 12.774 3.39223 12.768 3.24219 12.6776C3.09211 12.5871 3 12.4251 3 12.2499V2.74986C3 2.57461 3.09211 2.41261 3.24219 2.32213ZM4 11.4198L11.4277 7.49986L4 3.57896V11.4198Z"
            fill="currentColor"
          />
        </svg>
      </button>
      <button
        id="stop"
        disabled
        title="Stop the project"
        class="flex h-6 w-6 items-center justify-center rounded-[5px] bg-transparent p-0 text-xs text-vscode-icon enabled:cursor-pointer enabled:hover:bg-vscode-hover enabled:active:bg-vscode-active disabled:cursor-default disabled:opacity-40"
      >
        <svg viewBox="0 0 15 15" fill="none" class="h-4 w-4">
          <path
            d="M12 2C12.5523 2 13 2.44772 13 3V12C13 12.5523 12.5523 13 12 13H3C2.44772 13 2 12.5523 2 12V3C2 2.44772 2.44772 2 3 2H12ZM3 12H12V3H3V12Z"
            fill="currentColor"
          />
        </svg>
      </button>
    </div>
    <div id="stage" class="relative min-h-0 flex-1 *:absolute *:inset-0">
      <div
        id="overlay"
        class="z-10 flex flex-col items-center justify-center gap-2 p-4 text-center"
      >
        <div
          id="spinner"
          class="h-6 w-6 animate-spin rounded-full border-2 border-t-vscode-foreground border-vscode-widget-border"
        ></div>
        <h1 id="overlay-title" hidden class="text-[15px] font-semibold">Loading</h1>
        <p id="overlay-detail" hidden class="whitespace-pre-wrap text-xs opacity-80"></p>
      </div>
    </div>
    <script src="{{script}}"></script>
  </body>
</html>
